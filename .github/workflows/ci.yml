name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    name: API — import check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fastapi uvicorn httpx pydantic pydantic-settings python-dotenv websockets pytest pytest-asyncio httpx --break-system-packages

      - name: Check API imports
        run: python -c "from src.main import app; print('API import OK')"

      - name: Run tests
        run: pytest tests/test_api.py -v --tb=short